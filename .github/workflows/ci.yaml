name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site-mode: [static, collab]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and formatting
        run: npm run check

      - name: Test
        run: npm test

      - name: Build site
        env:
          SITE_MODE: ${{ matrix.site-mode }}
          SUPABASE_URL: ${{ matrix.site-mode == 'collab' && 'https://example.supabase.co' || '' }}
          SUPABASE_ANON_KEY: ${{ matrix.site-mode == 'collab' && 'public-anon-placeholder' || '' }}
        run: npx quartz build

  database-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify PostgreSQL migrations and grants
        run: bash scripts/verify-postgres-migrations.sh
